<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vishesh Pahuja, professional experience portfolio</title><meta name="description" content="Teaching portfolio mapped to the Australian Professional Standards for Teachers."><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2034%2034%22%3E%3Crect%20width%3D%2234%22%20height%3D%2234%22%20rx%3D%228%22%20fill%3D%22%23d99518%22%2F%3E%3Cpath%20d%3D%22M19.5%2024.2l3%203%206.2-7%22%20stroke%3D%22%230f1c23%22%20stroke-width%3D%223%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3Crect%20x%3D%227%22%20y%3D%229%22%20width%3D%2214%22%20height%3D%222.6%22%20rx%3D%221.3%22%20fill%3D%22%230f1c23%22%2F%3E%3Crect%20x%3D%227%22%20y%3D%2214.5%22%20width%3D%2220%22%20height%3D%222.6%22%20rx%3D%221.3%22%20fill%3D%22%230f1c23%22%20opacity%3D%22.55%22%2F%3E%3C%2Fsvg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet"><style id="style-main">:root{
  --ink:#0f1c23; --ink-2:#16272f; --ink-soft:#3c4f57;
  --chalk:#eceeea; --paper:#ffffff; --paper-2:#f7f8f6;
  --line:#dfe2dd; --line-2:#e9ebe7;
  --saffron:#d99518; --saffron-soft:#fbf2e0;
  --d1:#1f6f5c; --d2:#7a4f74; --d3:#2f5691;
  --text:#16232a; --muted:#5d6d74;
  --r:14px; --shadow:0 1px 1px rgba(15,28,35,.04), 0 10px 30px -12px rgba(15,28,35,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--chalk);color:var(--text);
  font-family:"Newsreader",Georgia,"Times New Roman",serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.ui{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif}
.ui{font-size:14px}
button{font-family:"Bricolage Grotesque",system-ui,sans-serif}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 26px}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:0;z-index:400;background:var(--saffron);color:#20160a;padding:10px 16px;
  border-radius:0 0 10px 0;font-family:"Bricolage Grotesque",sans-serif;font-size:13.5px;font-weight:600;text-decoration:none}
.skip:focus{left:0}

/* ---------- masthead ---------- */
.mast{background:var(--ink);color:#eaf0ef;position:relative;z-index:70}
.mast::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(700px 220px at 12% -10%, rgba(217,149,24,.20), transparent 62%),
             radial-gradient(600px 240px at 95% 120%, rgba(47,86,145,.28), transparent 60%)}
.mast-in{position:relative;z-index:2;display:flex;align-items:center;gap:16px;min-height:74px;flex-wrap:wrap;padding:10px 0}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.logo svg{display:block}
.logo b{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:16.5px;letter-spacing:-.01em;line-height:1.1}
.logo span{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:400;font-size:12px;color:#9fb3b6;letter-spacing:.01em}
.mast-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font-size:13.5px;font-weight:500;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);
  color:#eaf0ef;padding:8px 14px;border-radius:10px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:rgba(255,255,255,.13)}
.btn.solid{background:var(--saffron);border-color:var(--saffron);color:#20160a;font-weight:600}
.btn.solid:hover{background:#e6a52c}
.btn.live{background:#2a7d5f;border-color:#2a7d5f;color:#fff}
.btn.icon{padding:8px 11px;line-height:1;display:flex;align-items:center}
.kbd{font-family:"Bricolage Grotesque",sans-serif;font-size:11px;border:1px solid rgba(255,255,255,.28);
  border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:#b9c9cb;background:rgba(255,255,255,.05)}

/* save state pill */
.savepill{display:flex;align-items:center;gap:7px;font-family:"Bricolage Grotesque",sans-serif;font-size:12px;
  color:#9fb3b6;border:1px solid rgba(255,255,255,.16);border-radius:99px;padding:6px 12px;background:rgba(255,255,255,.04);cursor:pointer}
.savepill i{width:7px;height:7px;border-radius:50%;background:#5d7278;flex:none}
.savepill.ok i{background:#4bb18a}
.savepill.dirty i{background:var(--saffron)}
.savepill.bad{color:#ffc9c0;border-color:rgba(255,120,100,.45)}
.savepill.bad i{background:#e2705c}
.savepill:hover{background:rgba(255,255,255,.1)}

/* ---------- tabs ---------- */
.tabs{background:var(--ink-2);position:sticky;top:0;z-index:60;border-bottom:1px solid rgba(255,255,255,.07)}
.tabs-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;
  mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 24px),transparent 100%)}
.tabs-in.atend{mask-image:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;color:#9db0b4;font-size:12.5px;font-weight:500;
  padding:13px 7px 11px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px}
.tab:hover{color:#e6eeed}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--tabc,var(--saffron))}
.tab .chip{width:6px;height:6px;border-radius:50%;background:var(--tabc,#5d7278);flex:none}
.tab .cnt{font-size:10.5px;color:#7d9298;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] .cnt{color:#b9c9cb}
.tab.searchtab{color:#f0d9a8}
.tab.searchtab .chip{background:var(--saffron)}

/* ---------- panels ---------- */
main{min-height:60vh}
.view{display:none;padding:0 0 48px}
.view.on{display:block}
.view:focus{outline:none}

/* hero */
.hero{background:linear-gradient(180deg,var(--ink) 0%, var(--ink) 46%, var(--chalk) 46%)}
.hero-in{padding:48px 0 0}
.hero h1{margin:0;font-weight:600;font-size:clamp(34px,5.6vw,58px);line-height:1.02;letter-spacing:-.03em;color:#fff;max-width:14ch;hyphens:none}
.hero .role{margin:10px 0 0;font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(16px,2vw,20px);font-weight:500;color:var(--saffron);letter-spacing:-.01em}
.hero .sub{color:#a9bec1;font-size:17px;margin:14px 0 0;max-width:56ch;font-family:"Newsreader",serif}
.hero h1 .ed.empty::before,.hero .role .ed.empty::before,.hero .sub .ed.empty::before{color:#8ba0a3}
.factbar{margin-top:30px;display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
@media(max-width:760px){.factbar{grid-template-columns:1fr}}
.fact{background:var(--paper);padding:18px 20px}
.fact .k{font-family:"Bricolage Grotesque",sans-serif;font-size:12px;color:var(--muted);margin-bottom:3px}
.fact .v{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:15px;letter-spacing:-.01em}
.dial{display:flex;align-items:center;gap:14px}
.dial .num{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1}
.dial .num small{font-weight:500;font-size:13px;color:var(--muted)}
.dial .ring{flex:none}

.two{display:grid;grid-template-columns:1.35fr 1fr;gap:22px;margin-top:26px}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.block{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:24px 26px;box-shadow:var(--shadow)}
.block h2{margin:0 0 12px;font-size:20px;font-weight:600;letter-spacing:-.015em}
.block h2 .hint{font-weight:400;font-size:12.5px;color:var(--muted);margin-left:8px}
.pull{background:var(--ink);color:#f1f5f3;border:0}
.pull .q{font-size:21px;line-height:1.45;margin:0}
.pull .ed.empty::before{color:#8ba0a3}
.pull .who{margin-top:14px;font-family:"Bricolage Grotesque",sans-serif;font-size:12.5px;color:#9fb3b6}
.domain-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.leg{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);
  border-radius:999px;padding:7px 14px 7px 10px;font-family:"Bricolage Grotesque",sans-serif;font-size:13px;cursor:pointer}
.leg:hover{border-color:var(--saffron)}
.leg i{width:9px;height:9px;border-radius:3px;display:block}
.leg b{font-weight:600}
.leg span{color:var(--muted);font-variant-numeric:tabular-nums}

/* contact */
.contact{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.cline{display:flex;align-items:center;gap:8px;font-family:"Bricolage Grotesque",sans-serif;font-size:13.5px;
  border:1px solid var(--line);border-radius:10px;padding:7px 12px;background:var(--paper-2)}
.cline b{font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
.cline a{color:var(--d3);text-decoration:none;border-bottom:1px solid rgba(0,0,0,.15)}

/* philosophy */
.phil-head{background:var(--ink);color:#fff;padding:42px 0 46px}
.phil-head h1{margin:0;font-size:clamp(26px,4.2vw,40px);font-weight:600;letter-spacing:-.02em;max-width:20ch}
.phil-head p{color:#a9bec1;max-width:62ch;margin:14px 0 0}
.phil-head .ed.empty::before{color:#8ba0a3}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:-24px}
@media(max-width:940px){.pillars{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.pillars{grid-template-columns:1fr}}
.pillar{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);position:relative}
.pillar .n{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:30px;line-height:1;color:var(--saffron);letter-spacing:-.03em}
.pillar h3{margin:8px 0 10px;font-size:17.5px;font-weight:600;letter-spacing:-.01em;max-width:22ch}
.pillar ul{margin:0;padding-left:18px;font-size:15.5px;color:var(--ink-soft)}
.pillar li{margin-bottom:5px}
.pillar li.row{display:flex;gap:6px;align-items:flex-start}
.pillar li.row .ed{flex:1}
.apst{margin-top:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.apst b{font-family:"Bricolage Grotesque",sans-serif;font-size:11.5px;font-weight:600;background:var(--saffron-soft);
  color:#8a5e12;border-radius:6px;padding:3px 8px;display:inline-flex;align-items:center;gap:5px}
.apst b button{border:0;background:none;color:#8a5e12;cursor:pointer;padding:0;font-size:13px;line-height:1;display:none}
body.editing .apst b button{display:block}
.flow{margin-top:26px;background:var(--paper);border:1px dashed var(--line);border-radius:var(--r);
  padding:18px 22px;font-family:"Bricolage Grotesque",sans-serif;font-size:14px;color:var(--ink-soft);
  display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.flow em{font-style:normal;color:var(--saffron);font-weight:700}

/* standard view */
.std-head{background:var(--sc);color:#fff;padding:34px 0 40px;position:relative}
.std-head h1{margin:0;font-size:clamp(24px,3.6vw,34px);font-weight:600;letter-spacing:-.02em;max-width:26ch}
.std-head h1 .ed.empty::before{color:rgba(255,255,255,.6)}
.std-head .eyebrow{font-family:"Bricolage Grotesque",sans-serif;font-size:13px;opacity:.8;margin-bottom:6px}
.std-head .meter{margin-top:18px;display:flex;align-items:center;gap:12px;font-family:"Bricolage Grotesque",sans-serif;font-size:13px;flex-wrap:wrap}
.std-head .track{width:190px;height:6px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;display:flex}
.std-head .track i{display:block;height:100%;background:#fff}
.std-head .track i.part{background:rgba(255,255,255,.5)}
.focus-list{margin-top:-22px;display:flex;flex-direction:column;gap:18px}
.fcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:70px}
.fcard-top{padding:20px 24px 14px;display:flex;gap:16px;align-items:flex-start;border-left:4px solid var(--sc)}
.fcard-top .code{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:18px;color:var(--sc);letter-spacing:-.01em;flex:none;min-width:44px}
.fcard-top h3{margin:0 0 4px;font-size:17.5px;font-weight:600;letter-spacing:-.01em}
.fcard-top p{margin:0;font-size:14.5px;color:var(--muted);max-width:82ch}
.fcard-top .tw{flex:1;min-width:0}
.state{margin-left:auto;flex:none;font-family:"Bricolage Grotesque",sans-serif;font-size:11.5px;font-weight:600;
  padding:4px 10px;border-radius:99px;background:#eef2ef;color:var(--muted);white-space:nowrap}
.state.part{background:var(--saffron-soft);color:#8a5e12}
.state.done{background:color-mix(in srgb, var(--sc) 12%, white);color:var(--sc)}
.cols{display:grid;grid-template-columns:1fr 1.2fr 1fr;border-top:1px solid var(--line-2)}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.col{padding:18px 24px 22px;min-width:0}
.col+.col{border-left:1px solid var(--line-2)}
@media(max-width:900px){.col+.col{border-left:none;border-top:1px solid var(--line-2)}}
.col h4{margin:0 0 10px;font-family:"Bricolage Grotesque",sans-serif;font-size:12.5px;font-weight:600;color:var(--muted)}
.ev{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.ev li{font-size:15px;display:flex;gap:9px;align-items:flex-start;line-height:1.45}
.ev .mk{flex:none;width:7px;height:7px;border-radius:2px;background:var(--sc);margin-top:8px}
.ev .body{flex:1;min-width:0}
.ev a{color:var(--sc);text-decoration:none;border-bottom:1px solid rgba(0,0,0,.14);word-break:break-word}
.ev a:hover{border-bottom-color:currentColor}
.ev .meta{font-family:"Bricolage Grotesque",sans-serif;font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.ev .tools{flex:none;display:none;gap:2px}
body.editing .ev .tools{display:flex}
.ev .tools button{border:0;background:none;cursor:pointer;font-size:13px;line-height:1;padding:2px 3px;color:var(--muted)}
.ev .tools button:hover{color:var(--text)}
.ev .tools button.rm{color:#b04a4a}
.emptynote{color:#9aa5a3;font-style:italic;font-size:15px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-top:12px}
.shot{position:relative;aspect-ratio:4/3;border-radius:9px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in;background:var(--paper-2)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .x{position:absolute;top:3px;right:3px;width:19px;height:19px;border-radius:50%;border:0;background:rgba(15,28,35,.72);
  color:#fff;font-size:12px;line-height:19px;cursor:pointer;display:none;padding:0}
.shot .miss{display:flex;align-items:center;justify-content:center;height:100%;font-family:"Bricolage Grotesque",sans-serif;
  font-size:10px;color:var(--muted);text-align:center;padding:4px;line-height:1.25}
.ed{font-size:15.5px;line-height:1.6;color:inherit;min-height:1.2em;border-radius:8px;white-space:pre-wrap;word-break:break-word}
h1 .ed,h2 .ed,h3 .ed,h4 .ed,p .ed,.fact .v .ed,.cline .ed,.fcard-top .code .ed{font:inherit;letter-spacing:inherit}
.ed.one{white-space:normal}
.ed.inl{display:inline;white-space:normal}
body.editing .ed.inl{display:inline-block;vertical-align:baseline;min-width:5ch}
.ed.empty::before{content:attr(data-ph);color:#9aa5a3;font-style:italic}
.drop{display:none;margin-top:12px;border:1px dashed var(--line);border-radius:10px;padding:11px;
  font-family:"Bricolage Grotesque",sans-serif;font-size:12.5px;color:var(--muted);text-align:center}
.drop.hot{border-color:var(--saffron);background:var(--saffron-soft);color:#8a5e12}
.drop button{font-size:12.5px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 10px;cursor:pointer;margin:3px;color:var(--text)}
.drop button:hover{border-color:var(--sc);color:var(--sc)}
body.editing .drop{display:block}
body.editing .ev .rm,body.editing .shot .x{display:block}
body.editing .ed[contenteditable="true"],body.editing .ed[contenteditable="plaintext-only"]{outline:1px dashed #c3cdd0;outline-offset:3px;background:var(--paper-2)}
body.editing .hero .ed[contenteditable],body.editing .phil-head .ed[contenteditable],
body.editing .std-head .ed[contenteditable],body.editing .pull .ed[contenteditable],
body.editing .sum-head .ed[contenteditable]{outline-color:rgba(255,255,255,.4);background:rgba(255,255,255,.08)}
.editonly{display:none}
body.editing .editonly{display:block}
body.editing .editonly.inl{display:inline-flex}
.tinybtn{font-family:"Bricolage Grotesque",sans-serif;font-size:12.5px;border:1px dashed var(--line);background:var(--paper);
  border-radius:9px;padding:6px 11px;cursor:pointer;color:var(--muted);margin-top:10px}
.tinybtn:hover{border-color:var(--saffron);color:#8a5e12}
.cardtools{display:none;gap:6px;padding:8px 24px;border-top:1px solid var(--line-2);background:var(--paper-2)}
body.editing .cardtools{display:flex;flex-wrap:wrap}
.cardtools button{font-family:"Bricolage Grotesque",sans-serif;font-size:12px;border:1px solid var(--line);background:var(--paper);
  border-radius:8px;padding:5px 10px;cursor:pointer;color:var(--muted)}
.cardtools button:hover{border-color:var(--saffron);color:#8a5e12}
.cardtools button.danger:hover{border-color:#b04a4a;color:#b04a4a}

/* footer */
footer{background:var(--ink);color:#c3d1d2;padding:52px 0 26px;font-size:14.5px}
.fgrid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.2fr;gap:28px}
@media(max-width:820px){.fgrid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.fgrid{grid-template-columns:1fr}}
footer h5{font-family:"Bricolage Grotesque",sans-serif;color:#fff;font-size:13px;font-weight:600;margin:0 0 12px}
footer ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
footer button.link{background:none;border:0;color:#c3d1d2;padding:0;font-size:14px;cursor:pointer;text-align:left;font-family:"Newsreader",serif}
footer button.link:hover{color:#fff}
footer .blurb{max-width:44ch;color:#9fb3b6}
footer a.mail{color:#9fb3b6;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.2)}
.fbot{margin-top:34px;padding-top:18px;border-top:1px solid rgba(255,255,255,.1);display:flex;gap:14px;flex-wrap:wrap;
  font-family:"Bricolage Grotesque",sans-serif;font-size:12.5px;color:#8ba0a3}
.fbot span{margin-left:auto}

/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(160%);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:99px;font-family:"Bricolage Grotesque",sans-serif;font-size:13.5px;z-index:300;
  transition:transform .28s cubic-bezier(.2,.8,.3,1);box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;max-width:92vw}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast button{background:var(--saffron);border:0;color:#20160a;font-weight:600;font-size:12.5px;padding:5px 12px;border-radius:99px;cursor:pointer;flex:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}

/* ---------- search results panel ---------- */
.search{position:relative;display:flex;align-items:center}
.search .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.6;pointer-events:none}
.search input{width:230px;max-width:52vw;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);

olio is for.", "dev": ""}, {"code": "6.2", "title": "Engage in professional learning and improve practice", "desc": "Understand the relevant and appropriate sources of professional learning for teachers.", "evidence": [{"title": "Curriculum planning days", "href": "", "img": ""}], "demo": "I took part in the school's curriculum planning days on the Victorian Teaching and Learning Model.", "dev": ""}, {"code": "6.3", "title": "Engage with colleagues and improve practice", "desc": "Seek and apply constructive feedback from supervisors and teachers to improve teaching practices.", "evidence": [{"title": "Lesson observation feedback sheet", "href": "", "img": ""}], "demo": "I ask my mentor to watch for two or three specific things each lesson, and record the feedback and my next step.", "dev": ""}, {"code": "6.4", "title": "Apply professional learning and improve student learning", "desc": "Demonstrate an understanding of the rationale for continued professional learning and the implications for improved student learning.", "evidence": [], "demo": "I act on feedback in the following lesson and note what changed for students.", "dev": ""}]}, "7": {"title": "Engage professionally with colleagues, parents, carers and the community", "focus": [{"code": "7.1", "title": "Meet professional ethics and responsibilities", "desc": "Understand and apply the key principles described in codes of ethics and conduct for the teaching profession.", "evidence": [{"title": "Professional correspondence", "href": "", "img": ""}], "demo": "I keep student information confidential and work within the conduct expected by the Victorian Institute of Teaching.", "dev": ""}, {"code": "7.2", "title": "Comply with legislative, administrative and organisational requirements", "desc": "Understand the relevant legislative, administrative and organisational policies and processes required for teachers according to school stage.", "evidence": [{"title": "Placement records, child safe and safety rules", "hr   if(fileUpdated&&obj&&obj.savedAt&&new Date(obj.savedAt).getTime()<fileUpdated-1000)return false;
  Object.keys(stored).forEach(function(k){ D[k]=stored[k]; });
  lastSavedAt=obj&&obj.savedAt?new Date(obj.savedAt):null;
  draftState='ok';
  return true;
}
/* Put the bytes back against the attachment records restored from a draft. */
function rehydrate(){
  var jobs=[];
  eachAttachment(function(it){
    if(it.aid&&!it.img&&!it.file){
      jobs.push(ATT.get(it.aid).then(function(url){
        if(!url)return;
        if((it.mime||'').indexOf('image/')===0)it.img=url; else it.file=url;
      }));
    }
  });
  return Promise.all(jobs);
}
function eachAttachment(fn){
  SN.forEach(function(s){
    (D.standards[s].focus||[]).forEach(function(fo){ (fo.evidence||[]).forEach(fn); });
  });
  (D.library||[]).forEach(fn);
  ['interim','final'].forEach(function(k){ if(D.reports[k])fn(D.reports[k]); });
}
function touched(recount){
  dirty=true;
  D.meta.updated=new Date().toISOString();
  scheduleDraft();
  syncSavePill();
  if(recount){ syncTabs(); syncStateChips(); markDirty('overview','summary'); }
}
function syncSavePill(){
  if(READONLY)return;
  var p=document.querySelector('.savepill');
  if(!p)return;
  p.className='savepill'+(draftState==='fail'?' bad':(dirty?' dirty':' ok'));
  var label;
  if(draftState==='fail')label='Draft not cached, save the file';
  else if(dirty)label='Unsaved changes';
  else if(lastSavedAt)label='Saved '+lastSavedAt.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'});
  else label='Up to date';
  p.innerHTML='<i></i>'+esc(label);
  p.title=draftState==='fail'?draftError:'Click to save a copy of this file (Ctrl+S)';
}

/* ------------------------------------------------------------ progress maths */
/* Three states: 0 nothing yet, 1 partly there, 2 evidence plus an explanation. */
function stateOf(fo){
  var ev=(fo.evidence||[]).length>0;
  var demo=(fo.demo||'').trim().length>0;
  if(ev&&demo)return 2;
  if(ev||demo)return 1;
  return 0;
}
function counts(sn){
  var fs=D.standards[sn].focus||[],full=0,part=0;
  fs.forEach(function(fo){var s=stateOf(fo);if(s===2)full++;else if(s===1)part++;});
  return {full:full,part:part,total:fs.length};
}
function totals(){
  var t={full:0,part:0,total:0};
  SN.forEach(function(s){var c=counts(s);t.full+=c.full;t.part+=c.part;t.total+=c.total;});
  return t;
}
function domainOf(sn){
  for(var i=0;i<D.domains.length;i++){
    if(D.domains[i].standards.indexOf(+sn)>=0||D.domains[i].standards.indexOf(String(sn))>=0)return D.domains[i];
  }
  return {name:'',color:'#5d6d74',standards:[]};
}
function totalBytes(){
  var n=0;
  eachAttachment(function(it){ n+=it.size||dataURIsize(it.img||it.file); });
  return n;
}

/* ------------------------------------------------------- editable text field */
var PLAINTEXT=(function(){
  var d=document.createElement('div');
  try{ d.contentEditable='plaintext-only'; return d.contentEditable==='plaintext-only'?'plaintext-only':'true'; }
  catch(e){ return 'true'; }
})();
function stripPaste(e){
  if(PLAINTEXT==='plaintext-only')return;
  e.preventDefault();
  var t=(e.clipboardData||window.clipboardData).getData('text/plain')||'';
  document.execCommand('insertText',false,t);
}
/* get/set are closures over the data. Nothing re-renders while you type, so
   the caret never jumps. */
function field(get,set,opts){
  opts=opts||{};
  var d=el(opts.tag||'div','ed'+(opts.one?' one':'')+(opts.cls?' '+opts.cls:''));
  d.dataset.ph=editing?(opts.ph||'Add text'):(opts.roPh||'');
  var v=get()||'';
  d.textContent=v;
  if(!v)d.classList.add('empty');
  if(editing){
    d.setAttribute('contenteditable',PLAINTEXT);
    d.setAttribute('role','textbox');
    if(!opts.one)d.setAttribute('aria-multiline','true');
    d.setAttribute('aria-label',opts.ph||'Editable text');
    d.addEventListener('paste',stripPaste);
    d.addEventListener('input',function(){
      var t=opts.one?d.textContent.replace(/[\r\n]+/g,' '):(d.innerText||d.textContent);
      t=t.replace(/\u00a0/g,' ');
      set(t.replace(/\s+$/,''));
      d.classList.toggle('empty',!t.trim());
      touched(opts.recount);
    });
    if(opts.one)d.addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault();d.blur();} });
    d.addEventListener('blur',function(){ set((get()||'').trim()); });
  }
  return d;
}
function iconBtn(glyph,label,fn,cls){
  var b=el('button',cls||null,glyph);
  b.type='button';b.setAttribute('aria-label',label);b.title=label;
  b.onclick=function(e){e.stopPropagation();fn();};
  return b;
}
/* Move an item inside an array and re-render. */
function move(arr,i,delta,panel){
  var j=i+delta;
  if(j<0||j>=arr.length)return;
  var x=arr.splice(i,1)[0];arr.splice(j,0,x);
  touched(false);rebuild(panel);
}

/* -------------------------------------------------------------- file intake */
var MAX_BYTES=20*1048576;
function readAsDataURL(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){res(fr.result);};
    fr.onerror=function(){rej(new Error('read failed'));};
    fr.onabort=function(){rej(new Error('read aborted'));};
    fr.readAsDataURL(file);
  });
}
/* Photographs off a phone are far larger than a portfolio needs. */
function shrink(dataUrl){
  return new Promise(function(res){
    var im=new Image();
    var done=false;
    var finish=function(v){ if(!done){done=true;res(v);} };
    im.onload=function(){
      try{
        var max=1600,w=im.width,h=im.height;
        if(w>max||h>max){var k=Math.min(max/w,max/h);w=Math.round(w*k);h=Math.round(h*k);}
        var cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(im,0,0,w,h);
        finish(cv.toDataURL('image/jpeg',0.85));
      }catch(e){ finish(dataUrl); }
    };
    im.onerror=function(){ finish(dataUrl); };
    setTimeout(function(){ finish(dataUrl); },8000);
    im.src=dataUrl;
  });
}
function kindOf(it){
  var m=(it.mime||'')+' '+(it.name||'');
  if(it.img||/^image\//.test(it.mime||''))return 'img';
  if(/pdf/i.test(m))return 'pdf';
  if(/word|officedocument|\.docx?\b/i.test(m))return 'doc';
  return 'file';
}
function filesToItems(files,push,panel){
  files=Array.prototype.slice.call(files||[]);
  if(!files.length)return Promise.resolve();
  var added=0,skipped=[];
  return files.reduce(function(chain,f){
    return chain.then(function(){
      if(f.size>MAX_BYTES){ skipped.push(f.name+' ('+humanSize(f.size)+')'); return; }
      return readAsDataURL(f).then(function(url){
        var isImg=/^image\//.test(f.type||'');
        return (isImg?shrink(url):Promise.resolve(url)).then(function(stored){
          var aid=newAid();
          var it={title:f.name.replace(/\.[^.]+$/,''),name:f.name,
                  mime:f.type||'application/octet-stream',date:'',note:'',href:'',
                  aid:aid,size:dataURIsize(stored)};
          if(isImg)it.img=stored;else it.file=stored;
          ATT.put(aid,stored);
          push(it);added++;
        });
      }).catch(function(){ skipped.push(f.name); });
    });
  },Promise.resolve()).then(function(){
    if(added){ touched(true); rebuild(panel); }
    if(added&&!skipped.length)toast(added+(added>1?' files attached':' file attached'));
    else if(added&&skipped.length)toast(added+' attached. Too large or unreadable: '+skipped.join(', '));
    else if(skipped.length)toast('Could not attach '+skipped.join(', ')+'. The limit is '+humanSize(MAX_BYTES)+' a file.');
  });
}

/* ---------------------------------------------------- Word document reading */
/* A .docx is a zip of XML parts. Browsers can inflate raw deflate streams by
   themselves, so previewing one needs no library and no internet connection.
   The old build fetched mammoth (643KB) from a CDN on first use, which meant
   the preview failed offline. */
function zipIndex(bytes){
  var u16=function(o){return bytes[o]|bytes[o+1]<<8;};
  var u32=function(o){return (bytes[o]|bytes[o+1]<<8|bytes[o+2]<<16|bytes[o+3]<<24)>>>0;};
  if(bytes.length<22||u32(0)!==0x04034b50)return null;      /* not a zip */
  var eocd=-1,min=Math.max(0,bytes.length-66000);
  for(var i=bytes.length-22;i>=min;i--){ if(u32(i)===0x06054b50){eocd=i;break;} }
  if(eocd<0)return null;
  var count=u16(eocd+10),p=u32(eocd+16),dec=new TextDecoder('utf-8'),out={};
  for(var n=0;n<count;n++){
    if(p+46>bytes.length||u32(p)!==0x02014b50)break;
    var method=u16(p+10),csize=u32(p+20),usize=u32(p+24);
    var nlen=u16(p+28),elen=u16(p+30),clen=u16(p+32),lho=u32(p+42);
    var name=dec.decode(bytes.subarray(p+46,p+46+nlen));
    if(lho+30<=bytes.length){
      out[name]={method:method,csize:csize,usize:usize,
                 off:lho+30+u16(lho+26)+u16(lho+28)};
    }
    p+=46+nlen+elen+clen;
  }
  return out;
}
function zipRead(bytes,ent){
  if(!ent)return Promise.reject(new Error('missing part'));
  var slice=bytes.subarray(ent.off,ent.off+ent.csize);
  if(ent.method===0)return Promise.resolve(slice);
  if(ent.method!==8)return Promise.reject(new Error('unsupported compression'));
  if(typeof DecompressionStream==='undefined')return Promise.reject(new Error('no inflate'));
  var ds=new DecompressionStream('deflate-raw');
  var w=ds.writable.getWriter();
  w.write(slice);w.close();
  return new Response(ds.readable).arrayBuffer().then(function(ab){return new Uint8Array(ab);});
}
function bytesToDataURI(bytes,mime){
  var s='',CH=0x8000;
  for(var i=0;i<bytes.length;i+=CH)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return 'data:'+mime+';base64,'+btoa(s);
}
function mimeForName(name){
  var e=(name.split('.').pop()||'').toLowerCase();
  return {png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',
          bmp:'image/bmp',webp:'image/webp',svg:'image/svg+xml',tif:'image/tiff',
          tiff:'image/tiff',emf:'image/emf',wmf:'image/wmf'}[e]||'application/octet-stream';
}
function kids(node){
  var out=[],c=node.childNodes;
  for(var i=0;i<c.length;i++)if(c[i].nodeType===1)out.push(c[i]);
  return out;
}
function child(node,name){
  var c=kids(node);
  for(var i=0;i<c.length;i++)if(c[i].localName===name)return c[i];
  return null;
}
function attr(node,name){
  if(!node)return null;
  return node.getAttribute('w:'+name)||node.getAttribute(name)||null;
}
function relAttr(node,name){
  if(!node)return null;
  return node.getAttribute('r:'+name)||node.getAttribute(name)||null;
}

function docxToHtml(buffer){
  var bytes=new Uint8Array(buffer);
  var idx=zipIndex(bytes);
  if(!idx)return Promise.reject(new Error('not-docx'));
  if(!idx['word/document.xml'])return Promise.reject(new Error('not-docx'));
  var dec=new TextDecoder('utf-8');
  var parse=function(b){return new DOMParser().parseFromString(dec.decode(b),'application/xml');};
  var rels={},media={};

  return zipRead(bytes,idx['word/document.xml']).then(function(docBytes){
    var relsEnt=idx['word/_rels/document.xml.rels'];
    return (relsEnt?zipRead(bytes,relsEnt).catch(function(){return null;}):Promise.resolve(null))
      .then(function(relBytes){
        if(relBytes){
          var rx=parse(relBytes),all=rx.getElementsByTagName('*');
          for(var i=0;i<all.length;i++){
            if(all[i].localName!=='Relationship')continue;
            rels[all[i].getAttribute('Id')]={
              target:all[i].getAttribute('Target')||'',
              mode:all[i].getAttribute('TargetMode')||''
            };
          }
        }
        /* Pull in only the images this document actually references. */
        var wanted={};
        Object.keys(rels).forEach(function(id){
          var t=rels[id].target;
          if(!t||rels[id].mode==='External')return;
          var path=t.charAt(0)==='/'?t.slice(1):('word/'+t).replace(/\/\.\//g,'/');
          if(/\.(png|jpe?g|gif|bmp|webp|svg|tiff?)$/i.test(path)&&idx[path])wanted[id]=path;
        });
        var ids=Object.keys(wanted);
        return ids.reduce(function(chain,id){
          return chain.then(function(){
            return zipRead(bytes,idx[wanted[id]]).then(function(b){
              media[id]=bytesToDataURI(b,mimeForName(wanted[id]));
            }).catch(function(){});
          });
        },Promise.resolve()).then(function(){
          var xml=parse(docBytes);
          var root=xml.documentElement;
          if(!root||root.getElementsByTagName('parsererror').length)throw new Error('not-docx');
          var body=child(root,'body')||root;
          return renderBlocks(kids(body),{rels:rels,media:media});
        });
      });
  });
}
/* --- rendering ---------------------------------------------------------- */
function paraInfo(p){
  var pPr=child(p,'pPr'),info={heading:0,quote:false,list:false,level:0,center:false};
  if(!pPr)return info;
  var style=attr(child(pPr,'pStyle'),'val')||'';
  var m=/^Heading(\d)$/i.exec(style);
  if(m)info.heading=Math.min(6,+m[1]);
  if(/^Title$/i.test(style))info.heading=1;
  if(/^Subtitle$/i.test(style))info.heading=3;
  if(/Quote/i.test(style))info.quote=true;
  var numPr=child(pPr,'numPr');
  if(numPr||/^ListParagraph$/i.test(style)){
    info.list=true;
    var ilvl=numPr?child(numPr,'ilvl'):null;
    info.level=Math.min(5,parseInt(attr(ilvl,'val')||'0',10)||0);
  }
  var jc=attr(child(pPr,'jc'),'val');
  if(jc==='center')info.center=true;
  return info;
}
function runsHtml(node,ctx){
  var out='';
  kids(node).forEach(function(n){
    var ln=n.localName;
    if(ln==='r')out+=runHtml(n,ctx);
    else if(ln==='hyperlink'){
      var id=relAttr(n,'id'),rel=id?ctx.rels[id]:null;
      var href=rel?safeURL(rel.target):'';
      var inner=runsHtml(n,ctx);
      out+=href?('<a href="'+esc(href)+'" target="_blank" rel="noopener">'+inner+'</a>'):inner;
    }
    else if(ln==='ins'||ln==='sdt'||ln==='sdtContent'||ln==='smartTag')out+=runsHtml(n,ctx);
    else if(ln==='del')out+='';
  });
  return out;
}
function runHtml(r,ctx){
  var rPr=child(r,'rPr'),pre='',post='';
  if(rPr){
    var on=function(name){
      var e=child(rPr,name);
      if(!e)return false;
      var v=attr(e,'val');
      return v!=='0'&&v!=='false'&&v!=='none';
    };
    if(on('b')){pre+='<strong>';post='</strong>'+post;}
    if(on('i')){pre+='<em>';post='</em>'+post;}
    if(on('u')){pre+='<u>';post='</u>'+post;}
    if(on('strike')){pre+='<s>';post='</s>'+post;}
    var va=attr(child(rPr,'vertAlign'),'val');
    if(va==='superscript'){pre+='<sup>';post='</sup>'+post;}
    if(va==='subscript'){pre+='<sub>';post='</sub>'+post;}
  }
  var body='';
  kids(r).forEach(function(n){
    var ln=n.localName;
    if(ln==='t')body+=esc(n.textContent);
    else if(ln==='br')body+='<br>';
    else if(ln==='tab')body+='<span class="dx-tab"></span>';
    else if(ln==='noBreakHyphen')body+='-';
    else if(ln==='softHyphen')body+='';
    else if(ln==='sym')body+='';
    else if(ln==='drawing'||ln==='pict'||ln==='object')body+=imageHtml(n,ctx);
  });
  if(!body)return '';
  return pre+body+post;
}
function imageHtml(node,ctx){
  var all=node.getElementsByTagName('*'),src='',alt='';
  for(var i=0;i<all.length;i++){
    var ln=all[i].localName;
    if(ln==='blip'){
      var id=relAttr(all[i],'embed')||relAttr(all[i],'link');
      if(id&&ctx.media[id])src=ctx.media[id];
    }else if(ln==='imagedata'){
      var id2=relAttr(all[i],'id');
      if(id2&&ctx.media[id2])src=ctx.media[id2];
    }else if(ln==='docPr'){
      alt=all[i].getAttribute('descr')||all[i].getAttribute('name')||'';
    }
  }
  return src?('<img src="'+src+'" alt="'+esc(alt)+'">'):'';
}
function tableHtml(tbl,ctx){
  var rows='';
  kids(tbl).forEach(function(tr){
    if(tr.localName!=='tr')return;
    var cells='';
    kids(tr).forEach(function(tc){
      if(tc.localName!=='tc')return;
      var span=attr(child(child(tc,'tcPr')||tc,'gridSpan'),'val');
      var inner=renderBlocks(kids(tc),ctx)||'';
      cells+='<td'+(span&&+span>1?' colspan="'+(+span)+'"':'')+'>'+inner+'</td>';
    });
    rows+='<tr>'+cells+'</tr>';
  });
  return rows?('<table>'+rows+'</table>'):'';
}
function renderBlocks(nodes,ctx){
  var html='',listLevels=[];
  var closeTo=function(n){
    while(listLevels.length>n){ html+='</ul>'; listLevels.pop(); }
  };
  nodes.forEach(function(n){
    var ln=n.localName;
    if(ln==='p'){
      var info=paraInfo(n);
      var inner=runsHtml(n,ctx);
      if(info.list){
        if(!inner.trim())return;
        while(listLevels.length<info.level+1){ html+='<ul>'; listLevels.push(1); }
        closeTo(info.level+1);
        html+='<li>'+inner+'</li>';
        return;
      }
      closeTo(0);
      if(!inner.trim()){ html+='<p class="dx-blank"></p>'; return; }
      if(info.quote){ html+='<blockquote>'+inner+'</blockquote>'; return; }
      var tag=info.heading?('h'+info.heading):'p';
      html+='<'+tag+(info.center?' style="text-align:center"':'')+'>'+inner+'</'+tag+'>';
    }else if(ln==='tbl'){
      closeTo(0);
      html+=tableHtml(n,ctx);
    }
  });
  closeTo(0);
  return html;
}

/* ------------------------------------------------------------------- viewer */
var viewerSet=[],viewerAt=0,viewerReturn=null;
function openDoc(att,set){
  viewerSet=(set&&set.length)?set:[att];
  viewerAt=Math.max(0,viewerSet.indexOf(att));
  viewerReturn=document.activeElement;
  showViewer();
}
function showViewer(){
  var att=viewerSet[viewerAt];
  var v=document.getElementById('viewer');
  var body=v.querySelector('.viewer-body');
  v.querySelector('.t').textContent=att.title||att.name||'Document';
  v.querySelector('.ct').textContent=viewerSet.length>1?(viewerAt+1)+' of '+viewerSet.length:'';
  v.querySelector('.nav-prev').style.display=viewerSet.length>1?'':'none';
  v.querySelector('.nav-next').style.display=viewerSet.length>1?'':'none';
  body.innerHTML='';
  var dl=v.querySelector('.dl');
  var url=att.img||att.file||'';
  var name=att.name||att.title||'file';
  var link=safeURL(att.href);
  if(url){
    dl.href=URL.createObjectURL(dataURItoBlob(url));
    dl.download=name;dl.removeAttribute('target');dl.textContent='Download';dl.style.display='';
  }else if(link){
    dl.href=link;dl.target='_blank';dl.rel='noopener';dl.removeAttribute('download');dl.textContent='Open link';dl.style.display='';
  }else dl.style.display='none';

  v.classList.add('on');
  document.body.classList.add('locked');
  v.querySelector('.x').focus();

  var kind=kindOf(att);
  if(att.img){
    var im=el('img');im.src=att.img;im.alt=att.title||'Evidence';
    im.onclick=function(){im.classList.toggle('zoom');};
    im.title='Click to zoom';
    body.appendChild(im);return;
  }
  if(kind==='pdf'&&att.file){
    var f=el('iframe');f.src=URL.createObjectURL(dataURItoBlob(att.file));
    f.title=att.title||'PDF';body.appendChild(f);return;
  }
  if(kind==='doc'&&att.file){
    body.appendChild(el('div','viewer-note','Reading document…'));
    dataURItoBlob(att.file).arrayBuffer().then(docxToHtml).then(function(html){
      body.innerHTML='';
      body.appendChild(el('div','docx-render',html||'<p>This document has no readable text in it.</p>'));
    }).catch(function(err){
      body.innerHTML='';
      var older=/\.doc$/i.test(att.name||'')||(err&&err.message==='not-docx');
      body.appendChild(el('div','viewer-note',older
        ? 'This is an older Word format (.doc), which browsers cannot open on their own. Use Download to open it in Word, or save it as .docx and attach it again for an in\u2011page preview.'
        : 'This document could not be displayed here. Use Download to open it in Word.'));
    });
    return;
  }
  if(isMissing(att)){
    body.innerHTML='';
    body.appendChild(el('div','viewer-note','The file for “'+esc(att.title||att.name)+'” is not in this browser’s cache. Open your saved portfolio file, or attach it again.'));
    return;
  }
  if(link){
    var fr=el('iframe');fr.src=link;fr.title=att.title||'Link';
    body.appendChild(fr);
    body.appendChild(el('div','viewer-note','If nothing appears, the site blocks being shown inside another page. Use Open link.'));
    return;
  }
  body.appendChild(el('div','viewer-note','Nothing to preview for this item.'));
}
function closeViewer(){
  var v=document.getElementById('viewer');
  if(!v||!v.classList.contains('on'))return;
  v.classList.remove('on');
  document.body.classList.remove('locked');
  if(viewerReturn&&viewerReturn.focus)try{viewerReturn.focus();}catch(e){}
}
function stepViewer(d){
  if(viewerSet.length<2)return;
  viewerAt=(viewerAt+d+viewerSet.length)%viewerSet.length;
  showViewer();
}

/* ------------------------------------------------------------ evidence lists */
function evidenceRow(fo,it,i,panel){
  var li=el('li');
  li.appendChild(el('span','mk'));
  var body=el('div','body');
  var link=safeURL(it.href);
  if(editing){
    body.appendChild(field(function(){return it.title;},function(v){it.title=v;},{one:true,ph:'What is this evidence called?',recount:false}));
  }else if(link){
    var a=el('a');a.href=link;a.target='_blank';a.rel='noopener';a.textContent=it.title||link;body.appendChild(a);
  }else{

function setReport(key,file,label){
  if(file.size>MAX_BYTES){toast('That file is '+humanSize(file.size)+'. The limit is '+humanSize(MAX_BYTES)+'.');return;}
  readAsDataURL(file).then(function(url){
    var isImg=/^image\//.test(file.type||'');
    return (isImg?shrink(url):Promise.resolve(url)).then(function(stored){
      var aid=newAid();
      D.reports[key]={title:label,name:file.name,mime:file.type||'application/octet-stream',
        note:'',href:'',date:'',aid:aid,size:dataURIsize(stored)};
      if(isImg)D.reports[key].img=stored;else D.reports[key].file=stored;
      ATT.put(aid,stored);
      touched(false);rebuild('summary');toast(label+' attached');
    });
  }).catch(function(){toast('That file could not be read.');});
}

function norm(s){
  return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
var indexCache=null;
function invalidateIndex(){ indexCache=null; }
function buildIndex(){
  if(indexCache)return indexCache;
  var ix=[];
  function add(e){
    e.fields=e.fields.filter(function(f){return (f.text||'').trim();});

            {label:'Quote',text:p.quote},{label:'Contact',text:[p.email,p.linkedin,p.phone].filter(Boolean).join(' ')}]});
  add({tab:'philosophy',id:'v-philosophy',where:'Philosophy',color:'#d99518',title:D.philosophy.heading||'Teaching philosophy',
    fields:[{label:'Lead',text:D.philosophy.lead}]});
  D.philosophy.pillars.forEach(function(pl,i){

      title:(i+1)+'. '+(pl.t||'Pillar'),

  SN.forEach(function(sn){

    (st.focus||[]).forEach(function(fo){
      var evTitles=(fo.evidence||[]).map(function(e){return e.title;}).filter(Boolean).join(' · ');
      var evNotes=(fo.evidence||[]).map(function(e){return [e.note,e.name,prettyDate(e.date)].filter(Boolean).join(' ');}).filter(Boolean).join(' · ');
      var evLinks=(fo.evidence||[]).map(function(e){return e.href;}).filter(Boolean).join(' ');
      add({tab:'s'+sn,id:'f'+String(fo.code).replace(/\./g,'-'),where:'Standard '+sn+' · '+dom.name,color:dom.color,
        code:String(fo.code),title:fo.code+' '+fo.title,
        fields:[{label:'Focus area',text:fo.desc},
                {label:'Evidence',text:evTitles},
                {label:'Attachments',text:evNotes},
                {label:'Links',text:evLinks},
                {label:'How this meets the standard',text:fo.demo},
                {label:'Developing next',text:fo.dev}]});
    });
  });
  ['interim','final'].forEach(function(k){

    if(!a)return;
    add({tab:'summary',id:'v-summary',where:'Summary · Mentor reports',color:'#2f5691',
      title:(k==='interim'?'Interim report':'Final report'),
      fields:[{label:'File',text:[a.name,a.title].filter(Boolean).join(' ')},{label:'Note',text:a.note}]});
  });
  (D.library||[]).forEach(function(it){
    add({tab:'summary',id:'v-summary',where:'Summary · Supporting documents',color:'#2f5691',
      title:it.title||it.name||'Document',
      fields:[{label:'File',text:it.name},{label:'Note',text:it.note},{label:'Date',text:prettyDate(it.date)}]});
  });
  indexCache=ix;
  return ix;
}
function terms(q){
  return norm(q).split(/[^a-z0-9.+#']+/).filter(function(t){return t.length>0;});
}
function scoreEntry(e,tl,phrase){
  var ntitle=norm(e.title),score=0;
  for(var i=0;i<tl.length;i++){
    var t=tl[i];
    if(e.hay.indexOf(t)<0)return 0;              /* every word must appear */
    if(new RegExp('(^|[^a-z0-9])'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(ntitle))score+=60;
    else if(ntitle.indexOf(t)>=0)score+=32;
    var from=0,hits=0;
    while(hits<4){
      var at=e.hay.indexOf(t,from);
      if(at<0)break;
      hits++;from=at+t.length;
    }
    score+=hits*9;
  }
  if(phrase.length>1){
    if(ntitle.indexOf(phrase)>=0)score+=140;
    else if(e.hay.indexOf(phrase)>=0)score+=50;
  }
  if(e.code&&tl.indexOf(norm(e.code))>=0)score+=400;
  if(e.code&&tl.length===1&&norm(e.code).indexOf(tl[0])===0)score+=200;
  return score;
}
function runSearch(q){
  var tl=terms(q);
  if(!tl.length)return [];
  var phrase=norm(q).trim();
  var out=[];
  buildIndex().forEach(function(e){
    var s=scoreEntry(e,tl,phrase);
    if(s>0)out.push({e:e,score:s});
  });
  out.sort(function(a,b){return b.score-a.score;});
  return out;
}
function highlight(text,tl){
  if(!text)return '';
  var pat=tl.map(function(t){return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).sort(function(a,b){return b.length-a.length;}).join('|');
  if(!pat)return esc(text);
  var re=new RegExp('('+pat+')','gi');
  var parts=String(text).split(re);
  var html='';
  for(var i=0;i<parts.length;i++){
    if(i%2===1)html+='<mark>'+esc(parts[i])+'</mark>';
    else html+=esc(parts[i]);
  }
  return html;
}
function snippet(text,tl,len){
  var n=norm(text),first=-1;
  tl.forEach(function(t){var at=n.indexOf(t);if(at>=0&&(first<0||at<first))first=at;});
  if(first<0)return null;
  len=len||150;
  var start=Math.max(0,first-60);
  if(start>0){var sp=text.indexOf(' ',start);if(sp>=0&&sp<start+25)start=sp+1;}
  var out=text.slice(start,start+len);
  return (start>0?'…':'')+highlight(out,tl)+(start+len<text.length?'…':'');
}

function flash(id){
  var n=document.getElementById(id);

  try{ n.scrollIntoView({behavior:'smooth',block:'center'}); }catch(err){ n.scrollIntoView(); }
  n.classList.remove('flash');
  void n.offsetWidth;
  n.classList.add('flash');
  if(n.tabIndex<0)n.tabIndex=-1;
}
function moveSelection(d){

  var c=cards[selIdx];
  if(c)c.scrollIntoView({block:'nearest'});
}

  var cards=document.querySelectorAll('#v-search .r');

var state={query:''};

function tabLabel(id){
  if(id==='overview')return 'Overview';

  if(id==='summary')return 'Summary';
  if(id==='search')return 'Search results';
  return 'Standard '+id.slice(1);

function buildPanel(id){
  if(id==='overview')return viewOverview();
  if(id==='philosophy')return viewPhilosophy();
  if(id==='summary')return viewSummary();
  if(id==='search')return viewSearch();
  return viewStandard(id.slice(1));
}
function rebuild(id){
  invalidateIndex();
  if(!id)return;
  if(id==='all'){ PANELS_ORDER.concat(['search']).forEach(function(p){dirtyPanels[p]=true;}); id=state.current; }
  dirtyPanels[id]=true;
  if(state.current===id)renderPanel(id);
}
function markDirty(){
  invalidateIndex();
  Array.prototype.forEach.call(arguments,function(id){ if(id!==state.current)dirtyPanels[id]=true; });
}
function renderPanel(id){
  var host=panels[id];
  if(!host)return;
  var y=window.scrollY;
  host.innerHTML='';
  host.appendChild(buildPanel(id));
  dirtyPanels[id]=false;
  if(state.current===id)window.scrollTo(0,y);
}
function showPanel(id){
  if(dirtyPanels[id])renderPanel(id);
  PANELS_ORDER.concat(['search']).forEach(function(p){
    if(panels[p])panels[p].classList.toggle('on',p===id);
  });
}
function syncTabs(){

  });
  Array.prototype.forEach.call(bar.querySelectorAll('.tab'),function(b){
    var on=b.dataset.id===state.current;
    b.setAttribute('aria-selected',on?'true':'false');
    b.tabIndex=on?0:-1;
  });
  var cur=bar.querySelector('.tab[aria-selected="true"]');
  if(cur&&cur.scrollIntoView){
    try{ cur.scrollIntoView({block:'nearest',inline:'nearest'}); }catch(e){}
  }
  updateTabMask(bar);
  var st=bar.querySelector('.tab.searchtab');

  vw.addEventListener('keydown',function(e){
    if(e.key==='Tab'){
      var f=vw.querySelectorAll('button:not([style*="display: none"]),a[href]');
      if(!f.length)return;
      var first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
    if(e.key==='ArrowLeft')stepViewer(-1);
    if(e.key==='ArrowRight')stepViewer(1);
  });
}
function tabKeys(e){
  var keys=['ArrowLeft','ArrowRight','Home','End'];
  if(keys.indexOf(e.key)<0)return;
  var tabs=Array.prototype.slice.call(e.currentTarget.querySelectorAll('.tab')).filter(function(t){return t.style.display!=='none';});
  var i=tabs.indexOf(document.activeElement);
  if(i<0)i=tabs.findIndex(function(t){return t.getAttribute('aria-selected')==='true';});
  var j=i;
  if(e.key==='ArrowLeft')j=i-1;
  if(e.key==='ArrowRight')j=i+1;
  if(e.key==='Home')j=0;
  if(e.key==='End')j=tabs.length-1;
  j=clamp(j,0,tabs.length-1);
  e.preventDefault();
  tabs[j].focus();
  tabs[j].click();
}

/* ------------------------------------------------------------------ routing */
function parseHash(){
  var raw=(location.hash||'').replace(/^#/,'');
  var q='';
  var m=raw.indexOf('?q=');
  if(m>=0){ q=decodeURIComponent(raw.slice(m+3).replace(/\+/g,' ')); raw=raw.slice(0,m); }
  if(PANELS_ORDER.indexOf(raw)<0&&raw!=='search')raw='overview';
  return {id:raw,q:q};
}
var suppressHash=false;
function go(id,opts){
  opts=opts||{};
  if(PANELS_ORDER.indexOf(id)<0&&id!=='search')id='overview';
  state.current=id;
  var hash=id+(id==='search'&&state.query?('?q='+encodeURIComponent(state.query)):'');
  suppressHash=true;
  try{
    if(opts.replace)history.replaceState(null,'','#'+hash);
    else if(('#'+hash)!==location.hash)location.hash=hash;
  }catch(err){ try{location.hash=hash;}catch(e2){} }
  setTimeout(function(){suppressHash=false;},0);
  showPanel(id);
  syncTabs();
  if(!opts.keepScroll)window.scrollTo(0,0);
  var p=panels[id];
  if(p&&opts.focus)p.focus();
}
window.addEventListener('resize',function(){ updateTabMask(); });
window.addEventListener('hashchange',function(){
  if(suppressHash)return;
  var h=parseHash();
  if(h.id==='search'&&h.q!==state.query){
    state.query=h.q;
    var si=document.querySelector('.search input');
    if(si)si.value=h.q;
    rebuild('search');
  }
  state.current=h.id;
  showPanel(h.id);
  syncTabs();
});
function onSearchInput(val){
  state.query=val;
  selIdx=-1;searchFilter='all';
  var sw=document.querySelector('.search');
  if(sw)sw.classList.toggle('has',!!val.trim());
  dirtyPanels.search=true;
  syncTabs();
  if(val.trim().length>=2){
    if(state.current!=='search'){ lastBeforeSearch=state.current; }
    go('search',{replace:state.current==='search',keepScroll:state.current==='search'});
  }else if(state.current==='search'&&!val.trim()){
    go(lastBeforeSearch||'overview',{replace:true});
  }else if(state.current==='search'){
    renderPanel('search');
  }
}
var lastBeforeSearch='overview';

function modal(title,buildBody){
  var m=el('div','modal');
  m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label',title);

  var bar=el('div','modal-bar');
  bar.appendChild(el('h2',null,esc(title)));
  var x=el('button',null,'Close');x.type='button';
  bar.appendChild(x);
  box.appendChild(bar);
  var body=el('div','modal-body');
  buildBody(body,close);
  box.appendChild(body);
  m.appendChild(box);
  document.body.appendChild(m);
  document.body.classList.add('locked');
  m.classList.add('on');
  var ret=document.activeElement;
  x.focus();
  function close(){
    m.remove();
    document.body.classList.remove('locked');
    if(ret&&ret.focus)try{ret.focus();}catch(e){}
    rebuild('all');
    showPanel(state.current);
    buildShellChrome();
    syncTabs();
  }
  x.onclick=close;
  m.addEventListener('click',function(e){ if(e.target===m)close(); });
  m.addEventListener('keydown',function(e){ if(e.key==='Escape'){e.stopPropagation();close();} });
  return close;
}

function fileBase(){ return (D.profile.name||'portfolio').replace(/[^\w]+/g,'_'); }
function pickJSON(){
  pickFile('.json,application/json',function(file){
    var fr=new FileReader();
    fr.onload=function(){
      var o;
      try{ o=JSON.parse(fr.result); }catch(e){ toast('That file could not be read as portfolio data.'); return; }
      if(!o||!o.standards){ toast('That does not look like portfolio data.'); return; }
      if(!confirm('Replace the content of this portfolio with the data in '+file.name+'?'))return;
      Object.keys(o).forEach(function(k){ D[k]=o[k]; });
      normalise();
      afterBulkChange('Data imported.');
    };
    fr.readAsText(file);
  });
}
function pickHTML(){
  pickFile('.html,text/html',function(file){
    var fr=new FileReader();
    fr.onload=function(){
      var text=String(fr.result);
      var start=text.indexOf('window.DATA=');
      var end=text.indexOf(';<'+'/script>',start);
      if(start<0||end<0){ toast('That file does not contain portfolio data.'); return; }
      var o;
      try{ o=JSON.parse(text.slice(start+12,end)); }catch(e){ toast('The data inside that file could not be read.'); return; }
      if(!confirm('Restore this portfolio from '+file.name+'? Anything currently on screen is replaced.'))return;
      Object.keys(o).forEach(function(k){ D[k]=o[k]; });
      normalise();
      afterBulkChange('Restored from '+file.name+'.');
    };
    fr.readAsText(file);
  });
}

function saveFile(){
  var html=buildStandaloneHTML();
  var name=fileBase()+'_Portfolio.html';
  if(window.showSaveFilePicker){
    (function(){
      var chain=fileHandle?Promise.resolve(fileHandle):window.showSaveFilePicker({
        suggestedName:name,
        types:[{description:'Web page',accept:{'text/html':['.html']}}]
      });
      return chain.then(function(h){
        fileHandle=h;
        return h.createWritable().then(function(w){
          return w.write(new Blob([html],{type:'text/html'})).then(function(){return w.close();});
        }).then(function(){
          markSaved();
          toast('Saved to '+(h.name||name));
        });
      });
    })().catch(function(e){
      if(e&&(e.name==='AbortError'))return;
      fileHandle=null;
      downloadBlob(new Blob([html],{type:'text/html'}),name);
      markSaved();
      toast('Saved '+name+' to your downloads.');
    });
    return;
  }
  downloadBlob(new Blob([html],{type:'text/html'}),name);
  markSaved();
  toast('Saved '+name+'. Keep this file, it holds everything.');
}

  if(docs.length)h+=docs.map(function(e){
    return '<div class="d-att">Attached document: <b>'+esc(e.name||e.title)+'</b>'+
      (e.date?' · '+esc(prettyDate(e.date)):'')+(e.note?' · '+esc(e.note):'')+'</div>';
  }).join('');
  if(imgs.length)h+='<div class="d-shots">'+imgs.map(function(e){
    return '<figure><img src="'+e.img+'" alt="'+esc(e.title||'')+'"><figcaption>'+esc(e.title||'')+'</figcaption></figure>';
  }).join('')+'</div>';
  if(!links.length&&!docs.length&&!imgs.length)h+='<div class="d-empty">Evidence to be added</div>';
  return h;
}
function docFocus(fo,color){
  return '<div class="fa" style="border-left-color:'+color+'">'+
    '<div><span class="code" style="color:'+color+'">'+esc(fo.code)+'</span> <span class="ftitle">'+esc(fo.title)+'</span></div>'+
    '<div class="desc">'+esc(fo.desc)+'</div>'+
    '<div class="lab">Evidence</div>'+docEvidence(fo)+
    '<div class="lab">How this evidence meets the standard</div>'+
    (fo.demo?'<div>'+esc(fo.demo).replace(/\n/g,'<br>')+'</div>':'<div class="d-empty">To be completed</div>')+
    '<div class="lab">Developing next</div>'+
    (fo.dev?'<div>'+esc(fo.dev).replace(/\n/g,'<br>')+'</div>':'<div class="d-empty">To be completed</div>')+
    '</div>';
}
function docReport(key,label){
  var a=D.reports[key];
  if(!a)return '<div class="d-slot d-empty">'+esc(label)+' — to be attached</div>';
  if(a.img)return '<div class="d-slot"><b>'+esc(label)+'</b>'+(a.note?' · '+esc(a.note):'')+'<img src="'+a.img+'" alt="'+esc(label)+'"></div>';
  return '<div class="d-slot"><b>'+esc(label)+'</b> — attached: '+esc(a.name||'')+(a.note?' · '+esc(a.note):'')+'</div>';
}

    '.code,.ftitle{font-family:"Segoe UI",sans-serif;font-weight:700}'+
    '.desc{color:#5a6a72;font-size:10pt;margin:2px 0 8px}'+

  var p=D.profile,t=totals();
  var pil=D.philosophy.pillars.map(function(x,i){

        x.apst.map(function(a){return 'Standard '+esc(a);}).join(' · ')+'</div>':'')+'</div>';
  }).join('');
  var stds='';
  D.domains.forEach(function(dom){

      stds+='<div class="std"><div class="sh" style="background:'+dom.color+'">Standard '+sn+'. '+esc(st.title)+'</div>';
      (st.focus||[]).forEach(function(fo){ stds+=docFocus(fo,dom.color); });
      stds+='</div>';
    });
  });
  var toc='<div class="toc">'+D.domains.map(function(dom){
    return dom.standards.map(function(sn){
      var c=counts(String(sn));
      return '<div>Standard '+sn+'. '+esc(D.standards[sn]?D.standards[sn].title:'')+
        ' <span style="float:right">'+c.full+'/'+c.total+'</span></div>';
    }).join('');
  }).join('')+'</div>';
  var contact=[p.email,p.phone,p.linkedin].filter(Boolean).join(' · ');
  var cover='<div class="cover"><span class="badge">'+esc(p.initials||'')+'</span>'+

    '<div class="meta"><div>'+esc(p.school)+'</div><div>'+esc(p.program)+'</div><div>'+

    toc+'</div>';
  var about='<div class="sec"><h2>About my practice</h2><p>'+esc(p.about).replace(/\n/g,'<br>')+'</p>'+

  var reports='<div class="sec"><h2>Mentor reports</h2>'+docReport('interim','Interim report')+docReport('final','Final report')+'</div>';

  });
  if(D.reports.interim&&D.reports.interim.name)atts.push('Interim report: '+D.reports.interim.name);
  if(D.reports.final&&D.reports.final.name)atts.push('Final report: '+D.reports.final.name);
  (D.library||[]).forEach(function(e){ if(e.file)atts.push((e.name||e.title)+' — supporting document'); });
  var appx='<div class="sec"><h2>Attached documents</h2>'+
    (atts.length?'<ul class="appx">'+atts.map(function(a){return '<li>'+esc(a)+'</li>';}).join('')+'</ul>':'')+
    '<div class="d-empty">Space reserved for further evidence to be attached as the placement continues.</div></div>';
  var body=cover+about+phil+
    '<div class="sec"><h2>Evidence against the Australian Professional Standards for Teachers</h2></div>'+
    stds+reports+appx;
  if(mode==='word'){
    var wcss=css+'@page WordSection1{size:595.3pt 841.9pt;margin:2cm}div.WordSection1{page:WordSection1}';
    return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" '+
      'xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>'+esc(p.name)+', portfolio</title>'+
      '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->'+
      '<style>'+wcss+'</style></head><body><div class="WordSection1">'+body+'</div></body></html>';
  }
  /* Waiting for window.onload means every embedded photograph is decoded
     before the print dialog opens, so nothing prints blank. */
  return '<!doctype html><html><head><meta charset="utf-8"><title>'+esc(p.name)+', portfolio</title>'+
    '<style>'+css+'</style></head><body>'+body+
    '<script>window.onload=function(){setTimeout(function(){window.focus();window.print();},300);};<\/script>'+
    '</body></html>';
}
function downloadPDF(){
  var w=window.open('','_blank');
  if(!w){ toast('Allow pop‑ups for this page to build the PDF, or press Ctrl+P to print this page instead.'); return; }
  w.document.open();
  w.document.write(buildDocHTML());
  w.document.close();
  toast('Opening a print view. Choose Save as PDF as the destination.');
}
function downloadDOCX(){
  try{
    var blob=new Blob(['﻿'+buildDocHTML('word')],{type:'application/msword'});
    downloadBlob(blob,fileBase()+'_Portfolio.doc');
    toast('Word document downloaded. Open it in Word, then Save As .docx if you want to keep editing there.');
  }catch(e){ toast('The Word export failed. Try the PDF option.'); }
}

/* --------------------------------------------------------- global shortcuts */
document.addEventListener('keydown',function(e){
  var t=e.target,typing=t&&(/input|textarea|select/i.test(t.tagName)||t.isContentEditable);
  if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='S')&&!READONLY){ e.preventDefault(); saveFile(); return; }
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){
    e.preventDefault();
    var i=document.querySelector('.search input');
    if(i){i.focus();i.select();}
    return;
  }
  if(e.key==='Escape'){
    if(document.querySelector('.viewer.on')){ closeViewer(); return; }
    var m=document.querySelector('.modal.on');
    if(m){ return; }
  }
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='/'){
    e.preventDefault();
    var s=document.querySelector('.search input');
    if(s)s.focus();
  }else if(e.key==='?'){
    e.preventDefault();openHelp();
  }
});
document.addEventListener('paste',function(e){
  if(!editing)return;
  var files=e.clipboardData?Array.prototype.slice.call(e.clipboardData.files):[];
  if(!files.length)return;
  var col=document.activeElement&&document.activeElement.closest?document.activeElement.closest('.col'):null;
  if(!col)col=document.querySelector('.view.on .col');
  if(col&&col._focus){
    e.preventDefault();
    filesToItems(files,function(x){col._focus.evidence.push(x);},state.current);
  }
});
document.addEventListener('click',function(e){
  var m=document.querySelector('.menu');
  if(m&&!m.contains(e.target)){
    var l=m.querySelector('.menu-list');
    if(l&&l.classList.contains('on')){
      l.classList.remove('on');
      var mb=m.querySelector('.btn.solid');
      if(mb)mb.setAttribute('aria-expanded','false');
    }
  }
});
window.addEventListener('beforeunload',function(e){
  if(READONLY||!dirty)return;
  if(draftState==='fail'||idbOK===false){
    e.preventDefault();
    e.returnValue='Your latest edits are only in this tab. Use Save file first.';
    return e.returnValue;
  }
});
/* Print everything, including panels that have not been opened yet. */
window.addEventListener('beforeprint',function(){
  PANELS_ORDER.forEach(function(id){ if(dirtyPanels[id])renderPanel(id); });
});

/* ---------------------------------------------------------------- start up */
normalise();
var restored=loadDraft(fileUpdated);
if(restored)normalise();
var fileUpdated=(D.meta&&D.meta.updated)?new Date(D.meta.updated).getTime():0;
var h0=parseHash();
state.current=h0.id;
state.query=h0.q||'';
lastBeforeSearch=h0.id==='search'?'overview':h0.id;
buildShell();
var sw0=document.querySelector('.search');
if(sw0&&state.query)sw0.classList.add('has');
showPanel(state.current);
syncTabs();
ATT.available().then(function(v){ idbOK=v; });
if(restored){
  rehydrate().then(function(){
    var missing=0;
    eachAttachment(function(it){ if(isMissing(it))missing++; });
    if(missing){
      rebuild('all');showPanel(state.current);
      toast(missing+' attachment'+(missing>1?'s':'')+' could not be read back from this browser. Open your saved portfolio file to restore them.');
    }else{
      rebuild('all');showPanel(state.current);
    }
  });
  syncSavePill();
}
})();
